<html>
  <head>
    <title>tooltip</title>
  </head>
  <style>
    .tooltip {
      position: relative;
      display: inline-block;
      border-bottom: 1px dotted black;
      cursor: pointer;
    }

    .tooltiptext {
      visibility: hidden;
      width: 130px;
      background-color: black;
      color: #fff;
      text-align: center;
      border-radius: 6px;
      padding: 5px 0;
      position: absolute;
      z-index: 1;
      top: -5px;
      left: 75px;
    }

    .tooltip:hover .tooltiptext {
      visibility: visible;
    }
  </style>
  <body>
    <div class="tooltip">
      Hover me.
      <span class="tooltiptext">this effect occurs when hover</span>
    </div>
  </body>
</html>
